; cPanel-generated php ini directives, do not edit
; Manual editing of this file may result in unexpected behavior.
; To make changes to this file, use the cPanel MultiPHP INI Editor (Home >> Software >> MultiPHP INI Editor)
; For more information, read our documentation (https://go.cpanel.net/EA4ModifyINI)

display_errors = On
max_execution_time = 60
max_input_time = 60
max_input_vars = 1000
memory_limit = 512M
post_max_size = 516M
session.gc_maxlifetime = 1440
session.save_path = "/var/cpanel/php/sessions/ea-php82"
upload_max_filesize = 512M
zlib.output_compression = Off

; ===== Security hardening added 21 Sep 2026 =====
disable_functions = exec,passthru,shell_exec,system,proc_open,proc_close,proc_nice,proc_terminate,popen,pcntl_exec,dl,show_source,posix_kill,posix_setuid,posix_setpgid,posix_mkfifo
expose_php = Off
allow_url_include = Off
enable_dl = Off
output_buffering=on
